<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing Report Generator</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">

<style>
body { background-color:#f8fafc;font-family:'Segoe UI',sans-serif; }
input,textarea,select{border:1px solid #ccc;border-radius:5px;padding:4px 8px;width:100%;}
label{font-weight:600;}
table input,table select{width:100%;}
</style>
</head>

<body class="p-6">

<div class="max-w-6xl mx-auto bg-white shadow-lg rounded-xl p-6">

<h1 class="text-2xl font-bold text-center mb-4">Billing Report Generator</h1>

<!-- Header -->
<div class="grid grid-cols-2 gap-6 mb-4">
  <div>
    <label>Customer Name</label>
    <input id="clientName" value="CHETAN ATMARAM HATMODE">

    <label>Customer Address</label>
    <input id="clientAddr" value="At-Giravle, Post- Somatane, Tal- Panvel, Dist- Raigad, PIN- 410206">
  </div>

  <div>
    <label>Date</label>
    <input type="date" id="invoiceDate">

    <label class="mt-2 block">Invoice No</label>
    <input id="invoiceNo" value="28">
  </div>
</div>

<div class="mb-4">
  <label>Company</label>
  <textarea id="company" rows="4">TODAYGLOBAL PROPERTIES OfficeNo. 1601-1602, Navi Mumbai</textarea>
</div>

<div class="mb-4">
  <label>Subject</label>
  <input id="subject" value="Water Supply Work">
</div>

<!-- Table -->
<table class="table-auto w-full border mb-4">
<thead class="bg-gray-100">
<tr>
<th class="border">Sr No</th>
<th class="border">Date</th>
<th class="border">Material</th>
<th class="border">Challan</th>
<th class="border">Trip</th>
<th class="border">Tanker</th>
<th class="border">Amount</th>
<th class="border">Action</th>
</tr>
</thead>

<tbody id="tableBody">
<tr>
<td class="border text-center">1</td>
<td class="border"><input type="date"></td>
<td class="border"><input value="Water Tanker"></td>
<td class="border"><input></td>
<td class="border"><input value="1"></td>
<td class="border">
<select>
<option>MH06BD0396</option>
<option>MH24F9843</option>
<option>MH20BT2374</option>
</select>
</td>
<td class="border"><input type="number" placeholder="Enter Amount"></td>
<td class="border text-center">
<button onclick="removeRow(this)">✖</button>
</td>
</tr>
</tbody>
</table>

<button onclick="addRow()" class="bg-green-500 text-white px-3 py-1">+ Add Row</button>
<button id="generatePDF" class="bg-blue-500 text-white px-3 py-1">Generate PDF</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.3/jspdf.plugin.autotable.min.js"></script>

<script>

// Get First Date of Current Month
function getFirstDateOfMonth(){
  const t = new Date();
  const yyyy = t.getFullYear();
  const mm = String(t.getMonth()+1).padStart(2,'0');
  return `${yyyy}-${mm}-01`;
}

// Set default dates on load
document.addEventListener("DOMContentLoaded", ()=>{
  const firstDate = getFirstDateOfMonth();
  document.getElementById("invoiceDate").value = firstDate;
  document.querySelector("#tableBody input[type='date']").value = firstDate;
});

// Add Row
function addRow(){
  const tbody=document.getElementById("tableBody");
  const row=tbody.insertRow();
  const i=tbody.rows.length;

  row.innerHTML=`
    <td class="border text-center">${i}</td>
    <td class="border"><input type="date" value="${getFirstDateOfMonth()}"></td>
    <td class="border"><input value="Water Tanker"></td>
    <td class="border"><input></td>
    <td class="border"><input value="1"></td>
    <td class="border">
      <select>
        <option>MH06BD0396</option>
        <option>MH24F9843</option>
        <option>MH20BT2374</option>
      </select>
    </td>
    <td class="border"><input type="number" placeholder="Enter Amount"></td>
    <td class="border text-center">
      <button onclick="removeRow(this)">✖</button>
    </td>`;
}

// Remove Row
function removeRow(btn){
  btn.closest("tr").remove();
  [...document.querySelectorAll("#tableBody tr")].forEach((r,i)=>r.cells[0].innerText=i+1);
}

// Format Date
function formatDate(d){
  if(!d) return "";
  const [y,m,da]=d.split("-");
  return `${da}-${m}-${y}`;
}

// Generate PDF
document.getElementById("generatePDF").onclick = ()=>{
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();

  let rows=[];
  let total=0;

  document.querySelectorAll("#tableBody tr").forEach((r,i)=>{
    const inp=r.querySelectorAll("input,select");
    const amt=parseFloat(inp[5].value||0);
    total+=amt;

    rows.push([
      i+1,
      formatDate(inp[0].value),
      inp[1].value,
      inp[2].value,
      inp[3].value,
      inp[4].value,
      amt.toFixed(2)
    ]);
  });

  doc.autoTable({
    head:[["No","Date","Material","Challan","Trip","Tanker","Amount"]],
    body:rows
  });

  doc.text("Total: "+total.toFixed(2),10,doc.lastAutoTable.finalY+10);
  doc.save("bill.pdf");
}

</script>

</body>
</html>
