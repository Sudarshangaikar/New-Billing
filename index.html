<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invoice Generator</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">

<style>
body{background:#f8fafc;font-family:Arial;}
input,textarea,select{
  border:1px solid #000;
  padding:4px;
  width:100%;
}
table{border-collapse:collapse;}
th,td{border:1px solid #000;font-size:12px;padding:4px;text-align:center;}
</style>
</head>

<body class="p-6">

<div class="max-w-6xl mx-auto bg-white p-6 shadow">

<h2 class="text-center font-bold text-lg mb-4">Billing Generator</h2>

<!-- FORM -->
<div class="grid grid-cols-2 gap-4">
<div>
<label>Customer Name</label>
<input id="clientName" value="CHETAN ATMARAM HATMODE">

<label>Address</label>
<textarea id="clientAddr">At-Giravle, Post-Somatane, Tal-Panvel, Dist-Raigad, PIN-410206</textarea>
</div>

<div>
<label>Date</label>
<input type="date" id="invoiceDate">

<label>Invoice No</label>
<input id="invoiceNo" value="41">
</div>
</div>

<label class="mt-2">Company</label>
<textarea id="company">TODAYGLOBAL PROPERTIES Office No.1601-1602, 16th Floor, Kesar Solitaire, Plot No.5, Palm Beach Road, Sector-19, Sanpada, Navi Mumbai Maharashtra-400705</textarea>

<label class="mt-2">Subject</label>
<input id="subject" value="Construction & Sales Office Water Supply At Giravale Site (SAUBHAGYAM 2)">

<!-- TABLE -->
<table class="w-full mt-4">
<thead>
<tr>
<th>No</th>
<th>Date</th>
<th>Material</th>
<th>Challan</th>
<th>Trip</th>
<th>Tanker</th>
<th>Amount</th>
<th>Action</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<button onclick="addRow()" class="bg-green-500 text-white px-3 py-1 mt-2">+ Add Row</button>
<button onclick="generatePDF()" class="bg-blue-500 text-white px-3 py-1 mt-2">Generate PDF</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.3/jspdf.plugin.autotable.min.js"></script>

<script>

// DEFAULT DATE
function getDate(){
  let d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}

document.getElementById("invoiceDate").value=getDate();

// ADD ROW
function addRow(){
  let t=document.getElementById("tableBody");
  let i=t.rows.length+1;

  let r=t.insertRow();
  r.innerHTML=`
<td>${i}</td>
<td><input type="date" value="${getDate()}"></td>
<td><input value="Water Tanker"></td>
<td><input></td>
<td><input value="1"></td>
<td>
<select>
<option>MH06BD0396</option>
<option>MH24F9843</option>
<option>MH20BT2374</option>
</select>
</td>
<td><input type="number"></td>
<td><button onclick="removeRow(this)">X</button></td>`;
}

// REMOVE ROW
function removeRow(b){
  b.closest("tr").remove();
  [...document.querySelectorAll("#tableBody tr")]
  .forEach((r,i)=>r.cells[0].innerText=i+1);
}

// DATE FORMAT
function fDate(d){
  if(!d)return "";
  let [y,m,da]=d.split("-");
  return `${da}-${m}-${y}`;
}

// NUMBER TO WORDS (FIXED)
function toWords(num){
  let a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  let b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];

  if(num<20)return a[num];
  if(num<100)return b[Math.floor(num/10)]+" "+a[num%10];
  if(num<1000)return a[Math.floor(num/100)]+" Hundred "+toWords(num%100);
  if(num<100000)return toWords(Math.floor(num/1000))+" Thousand "+toWords(num%1000);
  return num;
}

// GENERATE PDF
function generatePDF(){

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();

  let y=10;

  let name=document.getElementById("clientName").value;
  let addr=document.getElementById("clientAddr").value;
  let date=fDate(document.getElementById("invoiceDate").value);
  let inv=document.getElementById("invoiceNo").value;
  let comp=document.getElementById("company").value;
  let sub=document.getElementById("subject").value;

  // HEADER (MATCH PDF)
  doc.setFontSize(11);
  doc.text(name,10,y);
  y+=6;

  doc.text(addr,10,y);
  y+=6;

  doc.text("TO,",10,y);
  doc.text("Date: "+date,140,y);
  y+=6;

  doc.text("TODAYGLOBAL PROPERTIES",10,y);
  doc.text("Invoice No: "+inv,140,y);
  y+=6;

  doc.text(doc.splitTextToSize(comp,180),10,y);
  y+=12;

  doc.text("Sub: "+sub,10,y);
  y+=8;

  // TABLE
  let rows=[],total=0;

  document.querySelectorAll("#tableBody tr").forEach((r,i)=>{
    let x=r.querySelectorAll("input,select");

    let amt=parseFloat(x[5].value||0);
    total+=amt;

    rows.push([
      i+1,
      fDate(x[0].value),
      x[1].value,
      x[2].value,
      x[3].value,
      x[4].value,
      amt.toFixed(2)
    ]);
  });

  doc.autoTable({
    startY:y,
    head:[["Sr No","Date","Material","Challan No","Trip No","Tanker No","Amount"]],
    body:rows,
    styles:{fontSize:8}
  });

  let fy=doc.lastAutoTable.finalY+8;

  // TOTAL (RIGHT SIDE)
  doc.text("Total  "+total.toFixed(2),150,fy);

  fy+=8;

  // WORDS (MATCH EXACT PDF FORMAT)
  doc.text("Rupees: "+toWords(Math.floor(total))+" Only/-",10,fy);

  fy+=15;

  // SIGNATURE
  doc.text("Chetan Atmaram Hatmode",130,fy);

  doc.save("Invoice.pdf");
}

// ADD FIRST ROW
addRow();

</script>

</body>
</html>
